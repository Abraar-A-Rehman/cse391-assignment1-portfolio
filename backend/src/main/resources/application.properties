spring.application.name=abraar-portfolio-backend
server.port=8080

# MySQL 8.x Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cse391_abraar_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JavaMailSender SMTP Configuration (Send Email on Contact Submit)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:abrar.a.rehman@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:your-app-password-here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
portfolio.contact.recipient=abrar.a.rehman@gmail.com
